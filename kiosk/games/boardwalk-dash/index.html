<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<title>Boardwalk Dash | Thirsty Beaches Arcade</title>
<meta name="theme-color" content="#070114">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/kiosk/games/shared/fonts.css">
<link rel="stylesheet" href="/kiosk/games/shared/kgame.css?v=4">
<link rel="stylesheet" href="/kiosk/games/shared/prize-panel.css?v=4">
<link rel="stylesheet" href="/kiosk/games/boardwalk-dash/boardwalk-dash.css?v=4">
<link rel="stylesheet" href="/kiosk/games/boardwalk-dash/kiosk.css?v=4">
</head>
<body class="kg kg-dash">
<div class="kg-backdrop" aria-hidden="true"></div>
<div class="kg-shell">
  <header class="kg-top">
    <h1 class="kg-title">Boardwalk Dash</h1>
    <div class="bd-hud" aria-label="Scoreboard">
      <span class="bd-hud__cell">Score <b id="bdScore">0</b></span>
      <span class="bd-hud__cell">Level <b id="bdLevel">1</b></span>
      <span class="bd-hud__cell">Best <b id="bdBest">0</b></span>
      <span class="bd-lives" id="bdLives" role="img" aria-label="Lives left: 3 of 3"><i class="bd-cup"></i><i class="bd-cup"></i><i class="bd-cup"></i></span>
    </div>
    <div class="bd-melt">
      <label class="bd-melt__label" for="bdMelt">Drink</label>
      <progress class="bd-melt__bar" id="bdMelt" max="100" value="100">Full</progress>
      <span class="bd-buffs" id="bdBuffs" hidden><span class="bd-buff bd-buff--ice" id="bdBuffFreeze" hidden>Freeze</span><span class="bd-buff bd-buff--swirl" id="bdBuffShield" hidden>Free bump</span></span>
    </div>
    <div class="kg-time" id="kgTime"><span>Time left</span><b>2:30</b><i><u></u></i></div>
  </header>
  <main class="kg-board-zone">
    <div class="kg-board" id="bdBoard">
      <canvas id="bdCanvas" width="432" height="610" role="img" aria-label="Boardwalk Dash game board. Hop one tile at a time from the trailer at the bottom, across boardwalk lanes of bikes and skaters, past sandcastles and crabs, and over the shoreline waves to the customer on the towel at the top. Swipe the board, tap it to hop forward, or use the arrow buttons."></canvas>
      <div class="bd-overlay" id="bdOverlay">
        <h2 class="bd-overlay__title" id="bdOvTitle">Boardwalk Dash</h2>
        <p class="bd-overlay__text" id="bdOvText">Carry the drink from the trailer to the customer on the towel before it melts. Tap the arrow buttons, or swipe the board, to hop.</p>
        <p class="kg-prizeline" data-kg-prizeline hidden></p>
        <p class="bd-overlay__best" id="bdOvBest" hidden></p>
        <button type="button" class="bd-btn bd-btn--go" id="bdStart">Start</button>
        <button type="button" class="kg-rules-btn" data-kg-rules>RULES</button>
      </div>
    </div>
  </main>
  <section class="kg-ctl" aria-label="Controls">
    <div class="kg-ctlrow kg-ctlrow--main">
      <div class="bd-pad" id="bdPad" role="group" aria-label="Hop pad">
        <button type="button" class="bd-pad__b bd-pad__b--left" data-dir="left" aria-label="Hop left"><span aria-hidden="true">&#9664;</span></button>
        <button type="button" class="bd-pad__b bd-pad__b--up" data-dir="up" aria-label="Hop up"><span aria-hidden="true">&#9650;</span></button>
        <button type="button" class="bd-pad__b bd-pad__b--down" data-dir="down" aria-label="Hop down"><span aria-hidden="true">&#9660;</span></button>
        <button type="button" class="bd-pad__b bd-pad__b--right" data-dir="right" aria-label="Hop right"><span aria-hidden="true">&#9654;</span></button>
      </div>
    </div>
    <div class="kg-ctlrow kg-ctlrow--small">
      <button type="button" class="bd-btn" id="bdPause" disabled>Pause</button>
      <button type="button" class="bd-btn" id="bdSound" aria-pressed="true">Sound On</button>
    </div>
  </section>
  <nav class="kg-bar" aria-label="Way back"><a class="kg-back" id="kgBack" href="/arcade/games">ALL GAMES</a><a class="kg-order" id="kgOrder" href="/#menu">ORDER DRINKS</a></nav>
</div>
<p class="sr-only" id="bdStatus" role="status" aria-live="polite"></p>
<script src="/kiosk/games/shared/kgame.js?v=4"></script>
<script src="/kiosk/games/shared/beach-music.js?v=1"></script>
<script src="/kiosk/games/shared/prize-panel.js?v=4"></script>
<script src="/kiosk/games/shared/rules-panel.js?v=4"></script>
<script src="/kiosk/games/boardwalk-dash/boardwalk-dash.js?v=4"></script>
</body>
</html>

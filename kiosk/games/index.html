<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<title>Games | Thirsty Beaches Arcade</title>
<meta name="theme-color" content="#070114">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/kiosk/games/shared/fonts.css">
<link rel="stylesheet" href="/kiosk/games/shared/kgame.css?v=4">
<link rel="stylesheet" href="/kiosk/games/shared/prize-panel.css?v=4">
<link rel="stylesheet" href="/kiosk/games/picker.css?v=4">
</head>
<body class="kg kg-picker">
<div class="kg-backdrop" aria-hidden="true"></div>
<div class="kg-shell">
  <header class="kg-top">
    <h1 class="kg-title">Boardwalk Arcade Games</h1>
    <p class="pk-sub">Pick a game</p>
    <p class="kg-prizeline" data-kg-prizeline="capped" hidden></p>
    <div class="kg-time" id="kgTime"><span>Time left</span><b>2:30</b><i><u></u></i></div>
  </header>
  <main class="pk-grid" aria-label="Games">
      <a class="pk-tile" href="/arcade/games/thirsty-blaster" data-game="thirsty-blaster" data-best="tb-blaster-best">
        <span class="pk-icon" aria-hidden="true"><img src="/kiosk/games/assets/tile-thirsty-blaster.webp" alt=""></span>
        <span class="pk-name">Thirsty Blaster</span>
        <span class="pk-how">Drag to squirt</span>
        <span class="pk-best"></span>
      </a>
      <a class="pk-tile" href="/arcade/games/thirsty-tower" data-game="thirsty-tower" data-best="tbTowerBest">
        <span class="pk-icon" aria-hidden="true"><img src="/kiosk/games/assets/tile-thirsty-tower.webp" alt=""></span>
        <span class="pk-name">Thirsty Tower</span>
        <span class="pk-how">Climb and jump</span>
        <span class="pk-best"></span>
      </a>
      <a class="pk-tile" href="/arcade/games/cup-catch" data-game="cup-catch" data-best="tb-cup-catch-best">
        <span class="pk-icon" aria-hidden="true"><img src="/kiosk/games/assets/tile-cup-catch.webp" alt=""></span>
        <span class="pk-name">Cup Catch</span>
        <span class="pk-how">Slide to catch</span>
        <span class="pk-best"></span>
      </a>
      <a class="pk-tile" href="/arcade/games/boardwalk-dash" data-game="boardwalk-dash" data-best="tb-boardwalk-dash-best">
        <span class="pk-icon" aria-hidden="true"><img src="/kiosk/games/assets/tile-boardwalk-dash.webp" alt=""></span>
        <span class="pk-name">Boardwalk Dash</span>
        <span class="pk-how">Hop across</span>
        <span class="pk-best"></span>
      </a>
      <a class="pk-tile" href="/arcade/games/soft-serve-stacker" data-game="soft-serve-stacker" data-best="tb_soft_serve_stacker_best_v1">
        <span class="pk-icon" aria-hidden="true"><img src="/kiosk/games/assets/tile-soft-serve-stacker.webp" alt=""></span>
        <span class="pk-name">Soft Serve Stacker</span>
        <span class="pk-how">Tap to drop</span>
        <span class="pk-best"></span>
      </a>
      <a class="pk-tile pk-tile--slots" href="/arcade" data-game="slots">
        <span class="pk-icon" aria-hidden="true"><img src="/kiosk/games/assets/tile-slots.webp" alt=""></span>
        <span class="pk-name">Slot Machine</span>
        <span class="pk-how">Pull the lever</span>
        <span class="pk-best"></span>
      </a>
  </main>
  <nav class="kg-bar" aria-label="Way back"><a class="kg-back" id="kgBack" href="/arcade">SLOT MACHINE</a><button type="button" class="kg-rulesbar" id="kgRules" data-kg-rules>RULES</button><a class="kg-order" id="kgOrder" href="/#menu">ORDER DRINKS</a></nav>
</div>
<script src="/kiosk/games/shared/kgame.js?v=4"></script>
<script src="/kiosk/games/shared/prize-panel.js?v=4"></script>
<script src="/kiosk/games/shared/rules-panel.js?v=4"></script>
<script src="/kiosk/games/picker.js?v=4"></script>
</body>
</html>

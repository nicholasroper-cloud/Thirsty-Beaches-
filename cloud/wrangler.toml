# Thirsty Beaches Make Station — Cloudflare Worker
# Deploy:  cd cloud && node build.js && npx wrangler deploy
# Secrets (set once, never in this file):  npx wrangler secret put CLOVER_API_TOKEN
#                                          npx wrangler secret put STATION_KEY
#                                          npx wrangler secret put CLOVER_ECOMM_TOKEN   ("Pay on my phone"; Hosted Checkout private key)
# Owner alerts (daily report, site monitoring) stay off until a notify channel is set; see OPS.md:
#   NTFY_TOPIC, or PUSHOVER_TOKEN + PUSHOVER_USER, or TWILIO_SID + TWILIO_TOKEN + TWILIO_FROM + NOTIFY_TO
name = "thirsty-beaches-station"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true
# Deploys (by hand or from .github/workflows/deploy-station.yml) keep any variables added in the
# Cloudflare dashboard instead of deleting them. Secrets are never touched by a deploy.
keep_vars = true
routes = [
  { pattern = "station.thirstybeaches.com", custom_domain = true }
]

[assets]
directory = "./public"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "none"

[vars]
CLOVER_MERCHANT_ID = "MQKMTFBRXFP21"
CLOVER_BASE_URL = "https://api.clover.com"
MAKE_LOOKBACK_HOURS = "16"
GRAB_CATEGORIES = "Treats"
PAGE_VERSION = "13"
# "Pay on my phone": TIPS = "1" turns on Clover's tip screen; QR_ENABLED = "0" switches phone pay off.
TIPS = "0"
QR_RATE_PER_HOUR = "60"
# "Order ahead" (station.thirstybeaches.com/order) is OFF unless ORDER_AHEAD = "true" is added in the
# Cloudflare dashboard (not here: a value in this file would override the dashboard on every deploy). See OPS.md.

[[kv_namespaces]]
binding = "STATE"
id = "a8cce29686e94412bef46bfb1778cb0f"

# Cron times are UTC. "30 13,14 * * *" = the daily sales report: 7:30 am Denver time in summer
# (13:30 UTC) and in winter (14:30 UTC); the earlier run that is past 7 am local sends it, once.
# "*/5 * * * *" = site monitoring (alerts only when something goes down / comes back).
[triggers]
crons = ["30 13,14 * * *", "*/5 * * * *"]
